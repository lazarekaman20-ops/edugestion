      <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    </noscript>

  <body class="font-sans antialiased bg-slate-50 text-slate-900 selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script>
      // Capturer précocement l'événement d'installation PWA avant le montage React
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      try {
        // Nettoyage automatique des clés obsolètes d'anciennes tentatives
        Object.keys(localStorage).forEach((key) => {
          if (key.toLowerCase().includes('accessgate') || key.toLowerCase().includes('access_gate')) {
            localStorage.removeItem(key);
          }
        });
      } catch (e) {}

      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => {
            if (name !== 'edugestion-pwa-cache-v5') {
              caches.delete(name);
            }
          });
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js', { scope: '/' })
            .then((registration) => {
              registration.update();
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
